name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: ci-password
      DATABASE_URL: postgresql://tracker:ci-password@localhost:5432/tracker
      TEST_DATABASE_URL: postgresql://tracker:ci-password@localhost:5432/tracker
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Apply migrations
        run: uv run python -m app.migrate
      - name: Load the seed data and run the daily totals query
        working-directory: .
        run: |
          for file in db/seed_foods.sql db/seed.sql db/queries.sql; do
            psql -h localhost -U tracker -d tracker -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: uv run pytest -q
