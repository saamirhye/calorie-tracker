[project]
name = "calorie-tracker-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pyright>=1.1",
  "httpx2>=2.15.1",
  "ruff>=0.17.1",
  "pre-commit>=4.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
